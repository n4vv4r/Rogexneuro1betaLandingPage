<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ff9d45" stop-opacity="0"/>
      <stop offset="76%" stop-color="#ff9d45" stop-opacity="0.85"/>
      <stop offset="86%" stop-color="#ffd9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff4e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4e2"/>
      <stop offset="45%" stop-color="#ffb066"/>
      <stop offset="100%" stop-color="#ff7a1e"/>
    </linearGradient>
  </defs>

  <!-- outer corona glow -->
  <circle cx="32" cy="32" r="30" fill="url(#corona)"/>

  <!-- glowing ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- black occluding disc -->
  <circle cx="30" cy="30" r="19" fill="#000000"/>
</svg>
