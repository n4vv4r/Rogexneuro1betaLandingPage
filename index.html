<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchOS</title>
  <meta name="theme-color" content="#000000">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      color: #e6edf3;
      font-family: ui-monospace, "SF Mono", Monaco, "Courier New", Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem 2rem;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Wired / CRT scanline overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.28) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.55;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-wrapper {
      text-align: center;
    }

    h1 {
      font-size: clamp(3.5rem, 15vw, 9.5rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.95;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      user-select: none;
    }

    .cursor {
      display: inline-block;
      width: 0.45em;
      height: 0.85em;
      background: #00ff66;
      margin-left: 0.08em;
      vertical-align: baseline;
      animation: blink 1.1s steps(2, start) infinite;
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.8);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    footer {
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      color: #8b949e;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .contact {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.4rem 0.6rem;
    }

    a {
      color: #00ff66;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00ff66;
      text-decoration: underline;
    }

    .discord {
      color: #f0f6fc;
    }

    @media (max-width: 600px) {
      body {
        padding: 2rem 1.25rem;
      }
      .contact {
        flex-direction: column;
        gap: 0.35rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="title-wrapper">
      <h1>EchOS<span class="cursor"></span></h1>
    </div>
  </main>

  <footer>
    <div class="contact">
      <span>contact me on:</span>
      <a href="https://x.com/navywakura" target="_blank" rel="noopener">x.com/navywakura</a>
      <span>,</span>
      <span>discord: <span class="discord">2006.kcc</span></span>
    </div>
  </footer>
</body>
</html>
