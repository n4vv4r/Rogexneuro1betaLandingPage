<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogex Laboratories — Industrial Research Infrastructure</title>
    <meta name="description" content="Rogex Laboratories builds experimental research infrastructure around PRISMA 3, RogexOS, Moscovium, Navi and the future rgx:// ecosystem." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rogex Laboratories — PRISMA 3 EEG Research Software" />
    <meta property="og:description" content="PRISMA 3 demonstrates initial subject-normalized EEG validation on OpenNeuro ds007358: 18 valid subjects, EC/EO resting EEG, 87.7% subject-normalized LOSO accuracy, alpha blocking confirmed." />
    <meta property="og:image" content="https://www.rogexlaboratories.com/og-prisma3.png" />
    <meta property="og:url" content="https://www.rogexlaboratories.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #15191a; color: #eef3ee; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      #root:empty::before {
        content: "Rogex Laboratories is loading...";
        display: block;
        margin: 48px auto;
        width: min(960px, calc(100% - 40px));
        padding: 32px;
        border: 1px solid rgba(238,243,238,.22);
        background: #202728;
        color: #eef3ee;
        font-size: 24px;
        font-weight: 800;
      }
      .boot-fallback {
        margin: 48px auto;
        width: min(960px, calc(100% - 40px));
        padding: 32px;
        border: 1px solid rgba(238,243,238,.22);
        background: #202728;
      }
      .boot-fallback h1 { margin: 0 0 12px; font-size: 42px; letter-spacing: -0.04em; }
      .boot-fallback p { margin: 0; color: #aeb9b0; line-height: 1.6; }
    </style>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && !root.dataset.reactMounted) {
          root.innerHTML =
            '<div class="boot-fallback">' +
            '<h1>Rogex Laboratories</h1>' +
            '<p>The frontend failed to start. Open the browser console and check the red error. Message: ' +
            String(event.message || 'unknown error').replace(/[<>&]/g, '') +
            '</p></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <h1>Rogex Laboratories</h1>
        <p>Industrial research infrastructure for PRISMA 3, RogexOS, Moscovium and rgx://. Loading interface...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
